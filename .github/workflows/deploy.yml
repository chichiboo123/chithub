name: Deploy Chithub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지: 진행 중인 배포가 있으면 취소하지 않고 대기
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 빌드 ─────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_ADMIN_GH_TOKEN: ${{ secrets.VITE_ADMIN_GH_TOKEN }}
          VITE_ADMIN_GIST_ID: ${{ secrets.VITE_ADMIN_GIST_ID }}
          VITE_ADMIN_GEMINI_KEY: ${{ secrets.VITE_ADMIN_GEMINI_KEY }}

      - name: Verify CNAME in dist
        run: |
          if [ -f dist/CNAME ]; then
            echo "✅ CNAME found: $(cat dist/CNAME)"
          else
            echo "❌ CNAME missing from dist — check public/CNAME"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 배포 ─────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
